# Vydání verze ReserveAndPay (SWD kap. 15.1, R14): když se na main objeví nové číslo verze
# v reserveandpay.php (nebo ručně přes „Run workflow“), sestaví balíček reserveandpay-X.Y.Z.zip
# a založí GitHub release vX.Y.Z s popisem změn z docs/DEVLOG.md. Existující release se nepřepisuje.
# Z releasu se plugin aktualizuje v prostředí WordPressu (Plugin Update Checker).
name: Release

on:
  push:
    branches: [main]
    paths: ['reserveandpay.php', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrola čísla verze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/rap.log") 2>&1
          HDR=$(sed -n 's/^ \* Version: *//p' reserveandpay.php | tr -d '[:space:]')
          CONST=$(sed -n "s/.*define( 'RESANDPAY_VERSION', '\([^']*\)'.*/\1/p" reserveandpay.php)
          echo "Hlavička $HDR, konstanta $CONST"
          [ -n "$HDR" ] && [ "$HDR" = "$CONST" ] || { echo "Version a RESANDPAY_VERSION nesouhlasí."; exit 1; }
          if gh release view "v$HDR" >/dev/null 2>&1; then echo "Release v$HDR už existuje – nic nedělám."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          grep -q "^## $HDR " docs/DEVLOG.md || { echo "V DEVLOGu chybí sekce ## $HDR"; exit 1; }
          echo "VERSION=$HDR" >> "$GITHUB_ENV"

      - name: Balíček
        if: env.SKIP != '1'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/rap.log") 2>&1
          mkdir -p build/reserveandpay
          for f in README.md admin assets includes languages lib public reserveandpay.php templates; do
            [ -e "$f" ] && cp -r "$f" build/reserveandpay/   # prázdné složky git neukládá
          done
          python3 -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', 'build', 'reserveandpay')" "reserveandpay-${VERSION}"
          python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(len(z.namelist()), 'souborů')" "reserveandpay-${VERSION}.zip"

      - name: Popis změn z DEVLOGu
        if: env.SKIP != '1'
        run: |
          exec > >(tee -a "$RUNNER_TEMP/rap.log") 2>&1
          awk -v v="## ${VERSION} " 'index($0, v) == 1 {f=1; next} /^## / {if (f) exit} f' docs/DEVLOG.md > notes.md
          TITLE=$(grep -m1 "^## ${VERSION} " docs/DEVLOG.md | sed 's/^## [^ ]* – //; s/ ([^)]*)$//')
          echo "TITLE=ReserveAndPay ${VERSION} – ${TITLE}" >> "$GITHUB_ENV"
          cat notes.md

      - name: GitHub release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/rap.log") 2>&1
          gh release create "v${VERSION}" "reserveandpay-${VERSION}.zip" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md

      # Při chybě zapíše poslední řádek logu do stavu commitu (kontext „release“), aby šel přečíst i bez přístupu k logům.
      - name: Stav při chybě
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(grep -v '^\s*$' "$RUNNER_TEMP/rap.log" 2>/dev/null | tail -1 | cut -c1-135)
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=release -f description="${MSG:-bez logu}" 
