# Vydání verze ReserveAndPay (SWD kap. 15.1, R14): po pushnutí značky vX.Y.Z sestaví balíček
# reserveandpay-X.Y.Z.zip a založí GitHub release s popisem změn z docs/DEVLOG.md.
# Z releasu se plugin aktualizuje v prostředí WordPressu (Plugin Update Checker).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrola čísla verze
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HDR=$(sed -n 's/^ \* Version: *//p' reserveandpay.php | tr -d '[:space:]')
          CONST=$(sed -n "s/.*define( 'RESANDPAY_VERSION', '\([^']*\)'.*/\1/p" reserveandpay.php)
          echo "Značka $TAG, hlavička $HDR, konstanta $CONST"
          [ "$TAG" = "$HDR" ] && [ "$TAG" = "$CONST" ] || { echo "Verze ve značce a v reserveandpay.php nesouhlasí."; exit 1; }
          grep -q "^## $TAG " docs/DEVLOG.md || { echo "V DEVLOGu chybí sekce ## $TAG"; exit 1; }
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Balíček
        run: |
          mkdir -p build/reserveandpay
          cp -r README.md admin assets includes languages lib public reserveandpay.php templates build/reserveandpay/
          (cd build && zip -qr "../reserveandpay-${VERSION}.zip" reserveandpay)
          unzip -l "reserveandpay-${VERSION}.zip" | tail -1

      - name: Popis změn z DEVLOGu
        run: |
          awk -v v="## ${VERSION} " 'index($0, v) == 1 {f=1; next} /^## / {if (f) exit} f' docs/DEVLOG.md > notes.md
          TITLE=$(grep -m1 "^## ${VERSION} " docs/DEVLOG.md | sed 's/^## [^ ]* – //; s/ ([^)]*)$//')
          echo "TITLE=ReserveAndPay ${VERSION} – ${TITLE}" >> "$GITHUB_ENV"
          cat notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "reserveandpay-${VERSION}.zip" --title "$TITLE" --notes-file notes.md --verify-tag
